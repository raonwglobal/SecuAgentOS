name: x86-64 VM Bootstrap

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu VM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf xorriso

      - name: Verify VM build dependencies
        run: |
          set -eu
          command -v qemu-system-x86_64
          command -v qemu-img
          command -v xorriso
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || test -f /usr/share/OVMF/OVMF_CODE.fd || test -f /usr/share/qemu/OVMF.fd
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "KVM available"; else echo "KVM unavailable; CI will use QEMU TCG"; fi

      - name: Set up Python for security/runtime tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run security and runtime unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q kernel runtime

      - name: Static smoke contract
        run: sh tests/vm/smoke.sh

      - name: Validate integrated installer builder
        shell: bash
        run: |
          set -euo pipefail
          sh -n tools/vm/installer/build-installer-v2.sh
          set +e
          SECUAGENTOS_PASSWORD_HASH= sh tools/vm/installer/build-installer-v2.sh > installer-guard.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q 'SECUAGENTOS_PASSWORD_HASH is required' installer-guard.log

      - name: Build and inspect integrated installer ISO (CI-only credentials)
        shell: bash
        run: |
          set -euo pipefail
          # This ISO is test-only and is intentionally not uploaded as an artifact.
          export SECUAGENTOS_PASSWORD_HASH="$(openssl passwd -6 -salt SecuAgentCI 'ci-only-not-for-deployment')"
          sh tools/vm/installer/build-installer-v2.sh
          iso=.build/vm/installer-v2/secuagentos-x86_64-installer-v2.iso
          test -s "$iso"
          test -s "$iso.sha256"
          sha256sum -c "$iso.sha256"
          xorriso -indev "$iso" -ls /nocloud/ | tee installer-iso-seed.log
          grep -q 'user-data' installer-iso-seed.log
          grep -q 'meta-data' installer-iso-seed.log
          xorriso -osirrox on -indev "$iso" -extract /boot/grub/grub.cfg .build/vm/installer-v2/verified-grub.cfg
          grep -q 'autoinstall' .build/vm/installer-v2/verified-grub.cfg
          grep -q 'ds=nocloud' .build/vm/installer-v2/verified-grub.cfg

      - name: Boot integrated installer ISO with QEMU UEFI
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          iso=.build/vm/installer-v2/secuagentos-x86_64-installer-v2.iso
          log=.build/vm/installer-v2/installer-uefi-serial.log
          disk=.build/vm/installer-v2/installer-test-disk.qcow2
          mkdir -p .build/vm/installer-v2
          qemu-img create -f qcow2 "$disk" 12G
          code=""
          vars=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            if [ -r "$candidate" ]; then code="$candidate"; break; fi
          done
          for candidate in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd /usr/share/edk2/ovmf/OVMF_VARS.fd; do
            if [ -r "$candidate" ]; then vars="$candidate"; break; fi
          done
          test -n "$code"
          test -n "$vars"
          cp "$vars" .build/vm/installer-v2/OVMF_VARS.fd
          rm -f "$log"
          qemu-system-x86_64 \
            -machine q35 -cpu max -m 4096 -smp 2 \
            -drive "if=pflash,format=raw,readonly=on,file=$code" \
            -drive "if=pflash,format=raw,file=.build/vm/installer-v2/OVMF_VARS.fd" \
            -drive "if=virtio,format=qcow2,file=$disk" \
            -cdrom "$iso" -boot order=d \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            -display none -serial "file:$log" -monitor none -no-reboot \
            > .build/vm/installer-v2/qemu-uefi.log 2>&1 &
          qemu_pid=$!
          cleanup() { kill "$qemu_pid" 2>/dev/null || true; wait "$qemu_pid" 2>/dev/null || true; }
          trap cleanup EXIT INT TERM
          deadline=$((SECONDS + 1200))
          saw_installer=0
          saw_reboot=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if grep -Eiq 'subiquity|starting installer|ubuntu server installer|curtin' "$log" 2>/dev/null; then
              saw_installer=1
            fi
            if grep -Eiq 'reboot: Restarting system|rebooting system|installation complete' "$log" 2>/dev/null; then
              saw_reboot=1
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          echo "========== INSTALLER UEFI SERIAL LOG =========="
          cat "$log" 2>/dev/null || true
          echo "========== QEMU UEFI LOG =========="
          cat .build/vm/installer-v2/qemu-uefi.log 2>/dev/null || true
          test "$saw_installer" -eq 1 || { echo "UEFI boot did not reach installer on serial console"; exit 1; }
          test "$saw_reboot" -eq 1 || { echo "Installer did not reach a completion/reboot marker within 20 minutes"; exit 1; }

      - name: Build Ubuntu x86-64 VM artifact
        shell: bash
        run: |
          set -o pipefail
          sh tools/vm/build.sh 2>&1 | tee vm-build.log

      - name: Inspect Ubuntu VM artifacts
        run: |
          set -eu
          test -s .build/vm/secuagentos-x86_64-ubuntu24.04.img
          test -s .build/vm/secuagentos-x86_64-cloud-init.iso
          qemu-img info .build/vm/secuagentos-x86_64-ubuntu24.04.img
          sha256sum -c .build/vm/secuagentos-x86_64-ubuntu24.04.img.sha256
          sha256sum -c .build/vm/secuagentos-x86_64-cloud-init.iso.sha256

      - name: Boot Ubuntu VM and wait for readiness
        shell: bash
        run: |
          set -u
          rm -f vm-boot.log
          sh tools/vm/run.sh > vm-boot.log 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true; wait "$qemu_pid" 2>/dev/null || true' EXIT INT TERM

          deadline=$((SECONDS + 240))
          ready=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if grep -q 'SECUAGENTOS_FOUNDATION_INTEGRATED=READY' vm-boot.log 2>/dev/null \
              && grep -q 'SECUAGENTOS_AGENT_RUNTIME=READY' vm-boot.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before Foundation and Agent Runtime became ready"
              break
            fi
            sleep 2
          done

          echo "========== VM BOOT LOG =========="
          cat vm-boot.log
          echo "========== END VM BOOT LOG =========="

          if [ "$ready" -ne 1 ]; then
            echo "SecuAgentOS Foundation/Agent Runtime did not become ready within 240 seconds"
            exit 1
          fi

          for marker in \
            'SECUAGENTOS_STATE=INIT_STARTED' \
            'SECUAGENTOS_STATE=FOUNDATION_READY' \
            'SECUAGENTOS_STATE=SECURITY_READY' \
            'SECUAGENTOS_STATE=SERVICES_READY' \
            'SECUAGENTOS_STATE=RUNTIME_READY' \
            'SECUAGENTOS_STATE=SYSTEM_READY' \
            'SECUAGENTOS_HEALTH=READY' \
            'SECUAGENTOS_FOUNDATION_INTEGRATED=READY' \
            'SECUAGENTOS_AGENT_RUNTIME=READY'; do
            grep -q "$marker" vm-boot.log || { echo "Missing boot marker: $marker"; exit 1; }
          done

      - name: Verify Foundation services
        shell: bash
        run: |
          set -eu
          grep -q 'SECUAGENTOS_FOUNDATION_INTEGRATED=READY' vm-boot.log
          grep -q 'foundation.ready' vm-boot.log
          grep -q 'SECUAGENTOS_AGENT_RUNTIME=READY' vm-boot.log

      - name: Upload Ubuntu VM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secuagentos-ubuntu-vm-diagnostics
          path: |
            vm-build.log
            vm-boot.log
            .build/vm/*.sha256
          if-no-files-found: warn
