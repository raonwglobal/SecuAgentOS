name: x86-64 VM Bootstrap

on:
  push:
    branches: [main, architecture/x86-64-vm-v1]
  pull_request:

jobs:
  vm-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu VM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf xorriso

      - name: Verify VM build dependencies
        run: |
          set -eu
          command -v qemu-system-x86_64
          command -v qemu-img
          command -v xorriso
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || test -f /usr/share/OVMF/OVMF_CODE.fd || test -f /usr/share/qemu/OVMF.fd
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "KVM available"; else echo "KVM unavailable; CI will use QEMU TCG"; fi

      - name: Set up Python for security/runtime tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run security and runtime unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q kernel runtime

      - name: Static smoke contract
        run: sh tests/vm/smoke.sh

      - name: Build Ubuntu x86-64 VM artifact
        shell: bash
        run: |
          set -o pipefail
          sh tools/vm/build.sh 2>&1 | tee vm-build.log

      - name: Inspect Ubuntu VM artifacts
        run: |
          set -eu
          test -s .build/vm/secuagentos-x86_64-ubuntu24.04.img
          test -s .build/vm/secuagentos-x86-64-cloud-init.iso || test -s .build/vm/secuagentos-x86_64-cloud-init.iso
          qemu-img info .build/vm/secuagentos-x86_64-ubuntu24.04.img
          sha256sum -c .build/vm/secuagentos-x86_64-ubuntu24.04.img.sha256
          sha256sum -c .build/vm/secuagentos-x86_64-cloud-init.iso.sha256

      - name: Boot Ubuntu VM and wait for readiness
        shell: bash
        run: |
          set -u
          rm -f vm-boot.log
          sh tools/vm/run.sh > vm-boot.log 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true; wait "$qemu_pid" 2>/dev/null || true' EXIT INT TERM

          deadline=$((SECONDS + 240))
          ready=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            # Health is emitted by the early bootstrap stage. Wait for the
            # full cloud-init/systemd chain so Foundation and Agent Runtime
            # readiness checks do not race provisioning.
            if grep -q 'SECUAGENTOS_FOUNDATION_INTEGRATED=READY' vm-boot.log 2>/dev/null \
              && grep -q 'SECUAGENTOS_AGENT_RUNTIME=READY' vm-boot.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before Foundation and Agent Runtime became ready"
              break
            fi
            sleep 2
          done

          echo "========== VM BOOT LOG =========="
          cat vm-boot.log
          echo "========== END VM BOOT LOG =========="

          if [ "$ready" -ne 1 ]; then
            echo "SecuAgentOS Foundation/Agent Runtime did not become ready within 240 seconds"
            exit 1
          fi

          for marker in \
            'SECUAGENTOS_STATE=INIT_STARTED' \
            'SECUAGENTOS_STATE=FOUNDATION_READY' \
            'SECUAGENTOS_STATE=SECURITY_READY' \
            'SECUAGENTOS_STATE=SERVICES_READY' \
            'SECUAGENTOS_STATE=RUNTIME_READY' \
            'SECUAGENTOS_STATE=SYSTEM_READY' \
            'SECUAGENTOS_HEALTH=READY' \
            'SECUAGENTOS_FOUNDATION_INTEGRATED=READY' \
            'SECUAGENTOS_AGENT_RUNTIME=READY'; do
            grep -q "$marker" vm-boot.log || { echo "Missing boot marker: $marker"; exit 1; }
          done


      - name: Verify Foundation services
        shell: bash
        run: |
          set -eu
          grep -q 'SECUAGENTOS_FOUNDATION_INTEGRATED=READY' vm-boot.log
          grep -q 'foundation.ready' vm-boot.log
          grep -q 'SECUAGENTOS_AGENT_RUNTIME=READY' vm-boot.log

      - name: Upload Ubuntu VM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secuagentos-ubuntu-vm-diagnostics
          path: |
            vm-build.log
            vm-boot.log
            .build/vm/*.sha256
          if-no-files-found: warn
